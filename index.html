<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>telepeel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 50% 40%, rgba(40, 110, 225, 0.55), transparent 60%),
      radial-gradient(circle at 15% 85%, rgba(10, 42, 102, 0.7), transparent 55%),
      linear-gradient(160deg, #12439e, #0a2a66);
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,0.08) 1.5px, transparent 1.6px);
    background-size: 30px 30px;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 260px rgba(3,15,45,0.75);
  }
  .banana {
    position: relative;
    height: 60vh;
    max-height: 640px;
    width: auto;
    transform-origin: 50% 88%;
    animation: dance 1.05s ease-in-out infinite;
    filter: drop-shadow(0 26px 30px rgba(0,0,0,0.45));
  }
  @keyframes dance {
    0%   { transform: translateY(0)   rotate(-8deg) scale(1,1); }
    25%  { transform: translateY(-6%) rotate(7deg)  scale(0.97,1.05); }
    50%  { transform: translateY(0)   rotate(8deg)  scale(1.05,0.95); }
    75%  { transform: translateY(-6%) rotate(-7deg) scale(0.97,1.05); }
    100% { transform: translateY(0)   rotate(-8deg) scale(1,1); }
  }
  @media (prefers-reduced-motion: reduce) { .banana { animation: none; } }
</style>
